<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Milad's 1st Birthday Games</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-active: #3730a3;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --success: #16a34a;
      --error: #dc2626;
      --border: #e2e8f0;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: auto 0;
    }

    header {
      text-align: center;
      padding-top: env(safe-area-inset-top);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:active {
      background: var(--primary-active);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
      margin-top: 8px;
    }

    input[type="text"] {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      background: #fff;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .diag-box {
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      word-break: break-all;
    }

    /* Embedded Drive Video Stage */
    .media-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .choice-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .choice-btn {
      min-height: 72px;
      padding: 10px 4px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: white;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.1s ease, transform 0.1s ease;
    }

    .choice-btn span.emoji {
      font-size: 1.5rem;
    }

    .choice-btn:active {
      background: #f1f5f9;
      transform: scale(0.96);
    }

    .choice-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    /* Photo Game */
    .photo-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      margin-bottom: 12px;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .month-picker-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .picker-display-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .stepper-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: white;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stepper-btn:active {
      background: #f1f5f9;
    }

    .selected-month-val {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      min-width: 140px;
      text-align: center;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      width: 100%;
    }

    .month-btn {
      min-height: 42px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .month-btn span.sub {
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: -2px;
    }

    .month-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: 0 3px 8px rgba(79, 70, 229, 0.35);
      transform: scale(1.04);
    }

    .month-btn.active span.sub {
      color: rgba(255, 255, 255, 0.85);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .feedback {
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 10px;
      min-height: 24px;
    }

    .correct { color: var(--success); }
    .wrong { color: var(--error); }

    .leaderboard-list {
      list-style: none;
      margin-top: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .rank {
      font-weight: 800;
      color: var(--muted);
      width: 28px;
    }

    .player {
      flex: 1;
      font-weight: 600;
      padding-right: 8px;
    }

    .pts {
      font-weight: 800;
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Milad's 1st Birthday! 🎂</h1>
    <p>Watch, Listen & Guess</p>
  </header>

  <!-- SCREEN 1: LOGIN -->
  <div id="screen-login" class="card">
    <h2 style="font-size: 1.15rem; margin-bottom: 6px;">Join the Games</h2>
    <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; line-height: 1.4;">
      Enter your name to start playing:
    </p>
    <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" />
    <button class="btn btn-primary" id="btn-start" onclick="initApp()">Start Game</button>
  </div>

  <!-- SCREEN 2: WHO SAID IT (DIRECT EMBED) -->
  <div id="screen-who" class="card hidden">
    <div class="status-bar">
      <span>Part 1: Who Made That Sound?</span>
      <span id="who-count">Loading...</span>
    </div>

    <div id="video-diag" class="diag-box">Loading player...</div>

    <!-- Clean iframe player pulling directly from Google Drive -->
    <div class="media-stage">
      <iframe id="who-frame" allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>

    <div class="choice-grid-3">
      <button class="choice-btn option-btn" onclick="submitWhoAnswer('Milad')">
        <span class="emoji">👶</span>
        <span>Milad</span>
      </button>
      <button class="choice-btn option-btn" onclick="submitWhoAnswer('Maher')">
        <span class="emoji">🧔</span>
        <span>Maher</span>
      </button>
      <button class="choice-btn option-btn" onclick="submitWhoAnswer('Maisune')">
        <span class="emoji">👩</span>
        <span>Maisune</span>
      </button>
    </div>

    <div id="who-feedback" class="feedback"></div>
  </div>

  <!-- SCREEN 3: GUESS THE AGE -->
  <div id="screen-age" class="card hidden">
    <div class="status-bar">
      <span>Part 2: Guess Milad's Age</span>
      <span id="age-count">1/5</span>
    </div>

    <div class="photo-frame">
      <img id="age-img" src="" alt="Baby photo" />
    </div>

    <div class="month-picker-container">
      <div class="picker-display-row">
        <button class="stepper-btn" onclick="stepMonth(-1)">−</button>
        <div class="selected-month-val"><span id="month-num">6</span> Months</div>
        <button class="stepper-btn" onclick="stepMonth(1)">+</button>
      </div>
      <div class="month-grid" id="month-grid"></div>
    </div>

    <button class="btn btn-primary" onclick="submitAgeGuess()">Confirm Guess</button>
    <div id="age-feedback" class="feedback"></div>
  </div>

  <!-- SCREEN 4: FINISH -->
  <div id="screen-finish" class="card hidden">
    <h2 style="text-align: center; font-size: 1.3rem;">You Finished! 🎈</h2>
    <p style="text-align: center; color: var(--muted); margin-top: 4px; font-size: 0.9rem;">Your Final Score:</p>
    <div style="font-size: 2.6rem; font-weight: 800; color: var(--primary); text-align: center; margin: 12px 0;">
      <span id="final-score">0</span> <span style="font-size: 1rem; color: var(--muted);">pts</span>
    </div>
    <button id="btn-save" class="btn btn-primary" onclick="saveScore()">Submit to Leaderboard</button>
  </div>

  <!-- SCREEN 5: LEADERBOARD -->
  <div id="screen-leaderboard" class="card hidden">
    <h3 style="text-align: center; margin-bottom: 6px; font-size: 1.15rem;">🏆 Party Leaderboard</h3>
    <ul id="leaderboard-items" class="leaderboard-list"></ul>
    <button class="btn btn-outline" onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycby9j4dJ7HtlkFPSMDRwhiCDBOOT2N_NsCbJRMbBadOfkXD0Uv0FkMuXyZvz_E3eIq4h/exec";

  const DEFAULT_LEADERBOARD = [
    { "name": "Baba", "score": 950 },
    { "name": "Mama", "score": 900 },
    { "name": "Auntie", "score": 850 }
  ];

  let playerName = "";
  let score = 0;
  let whoIdx = 0;
  let ageIdx = 0;
  let selectedMonth = 6;

  let driveVideos = [];
  let drivePhotos = [];

  function initMonthGrid() {
    const grid = document.getElementById("month-grid");
    grid.innerHTML = "";
    for (let i = 1; i <= 12; i++) {
      const btn = document.createElement("button");
      btn.className = `month-btn ${i === selectedMonth ? "active" : ""}`;
      btn.id = `month-btn-${i}`;
      btn.innerHTML = `${i}<span class="sub">mo</span>`;
      btn.onclick = () => selectMonth(i);
      grid.appendChild(btn);
    }
  }

  function selectMonth(m) {
    selectedMonth = Math.max(1, Math.min(12, m));
    document.getElementById("month-num").innerText = selectedMonth;

    document.querySelectorAll(".month-btn").forEach(btn => btn.classList.remove("active"));
    const activeBtn = document.getElementById(`month-btn-${selectedMonth}`);
    if (activeBtn) activeBtn.classList.add("active");
  }

  function stepMonth(delta) {
    selectMonth(selectedMonth + delta);
  }

  function getLeaderboardData() {
    const raw = localStorage.getItem("party_leaderboard_json");
    if (!raw) {
      localStorage.setItem("party_leaderboard_json", JSON.stringify(DEFAULT_LEADERBOARD));
      return DEFAULT_LEADERBOARD;
    }
    try {
      return JSON.parse(raw);
    } catch (e) {
      return DEFAULT_LEADERBOARD;
    }
  }

  function addScoreToJSON(name, finalScore) {
    const scores = getLeaderboardData();
    scores.push({
      name: name,
      score: finalScore,
      timestamp: new Date().toISOString()
    });
    scores.sort((a, b) => b.score - a.score);
    localStorage.setItem("party_leaderboard_json", JSON.stringify(scores));
    return scores;
  }

  async function initApp() {
    const input = document.getElementById("player-name");
    if (!input.value.trim()) {
      alert("Please enter your name!");
      return;
    }
    playerName = input.value.trim();

    initMonthGrid();

    const startBtn = document.getElementById("btn-start");
    startBtn.disabled = true;
    startBtn.innerText = "Loading from Drive...";

    try {
      const [vidsRes, photosRes] = await Promise.all([
        fetch(`${API_URL}?action=getVideos`).then(r => r.json()),
        fetch(`${API_URL}?action=getPhotos`).then(r => r.json())
      ]);

      driveVideos = Array.isArray(vidsRes) ? vidsRes : [];
      drivePhotos = Array.isArray(photosRes) ? photosRes : [];

      if (driveVideos.length === 0) {
        alert("0 videos found. Ensure filenames contain 'milad', 'maher', or 'maisune'.");
        startBtn.disabled = false;
        startBtn.innerText = "Start Game";
        return;
      }

      document.getElementById("screen-login").classList.add("hidden");
      document.getElementById("screen-who").classList.remove("hidden");
      renderWho();
    } catch (err) {
      console.error(err);
      alert("Failed to reach Apps Script. Check network connection.");
      startBtn.disabled = false;
      startBtn.innerText = "Start Game";
    }
  }

  function renderWho() {
    if (!driveVideos || driveVideos.length === 0 || whoIdx >= driveVideos.length) return;

    const item = driveVideos[whoIdx];
    const frame = document.getElementById("who-frame");
    const diag = document.getElementById("video-diag");

    document.getElementById("who-count").innerText = `${whoIdx + 1}/${driveVideos.length}`;
    document.getElementById("who-feedback").innerText = "";

    diag.innerHTML = `File: <b>${item.name}</b>`;

    // Embed Google Drive's native video player (works across all browsers)
    frame.src = `https://drive.google.com/file/d/${item.id}/preview`;
  }

  function submitWhoAnswer(choice) {
    if (!driveVideos[whoIdx]) return;

    const item = driveVideos[whoIdx];
    const fb = document.getElementById("who-feedback");

    document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = true);

    if (choice.toLowerCase() === item.answer.toLowerCase()) {
      score += 100;
      fb.className = "feedback correct";
      fb.innerText = `Spot on! It was ${item.answer}! (+100)`;
    } else {
      fb.className = "feedback wrong";
      fb.innerText = `Nope! That was actually ${item.answer}!`;
    }

    setTimeout(() => {
      whoIdx++;
      document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = false);
      if (whoIdx < driveVideos.length) {
        renderWho();
      } else {
        document.getElementById("screen-who").classList.add("hidden");
        document.getElementById("screen-age").classList.remove("hidden");
        renderAge();
      }
    }, 2500);
  }

  function renderAge() {
    if (!drivePhotos || drivePhotos.length === 0) {
      setTimeout(renderAge, 300);
      return;
    }
    const item = drivePhotos[ageIdx];
    document.getElementById("age-img").src = item.src;
    document.getElementById("age-count").innerText = `${ageIdx + 1}/${drivePhotos.length}`;
    document.getElementById("age-feedback").innerText = "";
    selectMonth(6);
  }

  function submitAgeGuess() {
    const guess = selectedMonth;
    const actual = drivePhotos[ageIdx].actualMonths;
    const diff = Math.abs(guess - actual);
    const pts = Math.max(0, 100 - (diff * 25));
    score += pts;

    const fb = document.getElementById("age-feedback");
    if (diff === 0) {
      fb.className = "feedback correct";
      fb.innerText = `Exact match! ${actual} months old! (+100)`;
    } else {
      fb.className = "feedback wrong";
      fb.innerText = `He was ${actual} months old! (+${pts} pts)`;
    }

    setTimeout(() => {
      ageIdx++;
      if (ageIdx < drivePhotos.length) {
        renderAge();
      } else {
        document.getElementById("screen-age").classList.add("hidden");
        document.getElementById("screen-finish").classList.remove("hidden");
        document.getElementById("final-score").innerText = score;
      }
    }, 1400);
  }

  function saveScore() {
    const updatedLeaderboard = addScoreToJSON(playerName, score);
    renderLeaderboard(updatedLeaderboard);
  }

  function renderLeaderboard(scores) {
    document.getElementById("screen-finish").classList.add("hidden");
    document.getElementById("screen-leaderboard").classList.remove("hidden");

    const list = document.getElementById("leaderboard-items");
    list.innerHTML = scores.slice(0, 10).map((entry, idx) => `
      <li class="leaderboard-item">
        <span class="rank">#${idx + 1}</span>
        <span class="player">${escapeText(entry.name)}</span>
        <span class="pts">${entry.score} pts</span>
      </li>
    `).join("");
  }

  function escapeText(str) {
    const div = document.createElement("div");
    div.innerText = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
