<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Milad's 1st Birthday Games</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-active: #3730a3;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --success: #16a34a;
      --error: #dc2626;
      --border: #e2e8f0;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: auto 0;
      position: relative;
    }

    header {
      text-align: center;
      padding-top: env(safe-area-inset-top);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
      margin-top: 8px;
    }

    input[type="text"] {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      background: #fff;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .media-stage {
      position: relative;
      width: 100%;
      height: 420px;
      max-height: 55vh;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .choice-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .choice-btn {
      min-height: 72px;
      padding: 10px 4px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: white;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.1s ease, transform 0.1s ease;
    }

    .choice-btn span.emoji {
      font-size: 1.5rem;
    }

    .choice-btn:active {
      background: #f1f5f9;
      transform: scale(0.96);
    }

    .photo-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      margin-bottom: 12px;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .month-picker-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .selected-month-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      min-height: 32px;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      width: 100%;
    }

    .month-btn {
      min-height: 46px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .month-btn span.sub {
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: -2px;
    }

    .month-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: 0 3px 8px rgba(79, 70, 229, 0.35);
      transform: scale(1.04);
    }

    .month-btn.active span.sub {
      color: rgba(255, 255, 255, 0.85);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* LARGE PROMINENT RESULT OVERLAY */
    .result-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: white;
      z-index: 50;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .overlay-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
    }

    .overlay-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .overlay-title.correct { color: #4ade80; }
    .overlay-title.wrong { color: #f87171; }

    .overlay-points {
      font-size: 1.1rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .overlay-detail {
      font-size: 1.25rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 24px;
      width: 100%;
    }

    .leaderboard-list {
      list-style: none;
      margin-top: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .rank {
      font-weight: 800;
      color: var(--muted);
      width: 28px;
    }

    .player {
      flex: 1;
      font-weight: 600;
      padding-right: 8px;
    }

    .pts {
      font-weight: 800;
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Milad's 1st Birthday! 🎂</h1>
    <p>Watch, Listen & Guess</p>
  </header>

  <!-- SCREEN 1: LOGIN -->
  <div id="screen-login" class="card">
    <h2 style="font-size: 1.15rem; margin-bottom: 6px;">Join the Games</h2>
    <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; line-height: 1.4;">
      Enter your name to start playing:
    </p>
    <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" />
    <button class="btn btn-primary" id="btn-start" onclick="initApp()">Start Game</button>
  </div>

  <!-- SCREEN 2: WHO SAID IT -->
  <div id="screen-who" class="card hidden">
    <div class="status-bar">
      <span>Part 1: Who Made That Sound?</span>
      <span id="who-count">Loading...</span>
    </div>

    <div class="media-stage">
      <iframe id="who-frame" allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>

    <div class="choice-grid-3">
      <button class="choice-btn" onclick="submitWhoAnswer('Milad')">
        <span class="emoji">👶</span>
        <span>Milad</span>
      </button>
      <button class="choice-btn" onclick="submitWhoAnswer('Maher')">
        <span class="emoji">🧔</span>
        <span>Maher</span>
      </button>
      <button class="choice-btn" onclick="submitWhoAnswer('Maisune')">
        <span class="emoji">👩</span>
        <span>Maisune</span>
      </button>
    </div>

    <!-- Video Question Overlay -->
    <div id="who-overlay" class="result-overlay hidden">
      <div id="who-icon" class="overlay-icon"></div>
      <div id="who-title" class="overlay-title"></div>
      <div id="who-pts" class="overlay-points"></div>
      <div id="who-detail" class="overlay-detail"></div>
      <button class="btn btn-primary" onclick="advanceWho()">Next Question ➔</button>
    </div>
  </div>

  <!-- SCREEN 3: GUESS THE AGE -->
  <div id="screen-age" class="card hidden">
    <div class="status-bar">
      <span>Part 2: Guess Milad's Age</span>
      <span id="age-count">1/5</span>
    </div>

    <div class="photo-frame">
      <img id="age-img" src="" alt="Baby photo" />
    </div>

    <div class="month-picker-container">
      <div class="selected-month-val" id="month-display-text">Select a Month 👇</div>
      <div class="month-grid" id="month-grid"></div>
    </div>

    <button class="btn btn-primary" id="btn-confirm-age" disabled onclick="submitAgeGuess()">Confirm Guess</button>

    <!-- Photo Question Overlay -->
    <div id="age-overlay" class="result-overlay hidden">
      <div id="age-icon" class="overlay-icon"></div>
      <div id="age-title" class="overlay-title"></div>
      <div id="age-pts" class="overlay-points"></div>
      <div id="age-detail" class="overlay-detail"></div>
      <button class="btn btn-primary" id="age-next-btn" onclick="advanceAge()">Next Question ➔</button>
    </div>
  </div>

  <!-- SCREEN 4: FINISH -->
  <div id="screen-finish" class="card hidden">
    <h2 style="text-align: center; font-size: 1.3rem;">You Finished! 🎈</h2>
    <p style="text-align: center; color: var(--muted); margin-top: 4px; font-size: 0.9rem;">Your Final Score:</p>
    <div style="font-size: 2.6rem; font-weight: 800; color: var(--primary); text-align: center; margin: 12px 0;">
      <span id="final-score">0</span> <span style="font-size: 1rem; color: var(--muted);">pts</span>
    </div>
    <button id="btn-save" class="btn btn-primary" onclick="saveScore()">Submit to Leaderboard</button>
  </div>

  <!-- SCREEN 5: LEADERBOARD -->
  <div id="screen-leaderboard" class="card hidden">
    <h3 style="text-align: center; margin-bottom: 6px; font-size: 1.15rem;">🏆 Party Leaderboard</h3>
    <ul id="leaderboard-items" class="leaderboard-list"></ul>
    <button class="btn btn-outline" onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycby9j4dJ7HtlkFPSMDRwhiCDBOOT2N_NsCbJRMbBadOfkXD0Uv0FkMuXyZvz_E3eIq4h/exec";

  // Clean empty leaderboard starter
  const DEFAULT_LEADERBOARD = [];

  let playerName = "";
  let score = 0;
  let whoIdx = 0;
  let ageIdx = 0;
  let selectedMonth = null;

  let driveVideos = [];
  let drivePhotos = [];

  function initMonthGrid() {
    const grid = document.getElementById("month-grid");
    grid.innerHTML = "";
    for (let i = 1; i <= 12; i++) {
      const btn = document.createElement("button");
      btn.className = "month-btn";
      btn.id = `month-btn-${i}`;
      btn.innerHTML = `${i}<span class="sub">mo</span>`;
      btn.onclick = () => selectMonth(i);
      grid.appendChild(btn);
    }
  }

  function selectMonth(m) {
    selectedMonth = m;
    document.getElementById("month-display-text").innerText = `${selectedMonth} Month${selectedMonth > 1 ? "s" : ""} Old`;
    document.getElementById("btn-confirm-age").disabled = false;

    document.querySelectorAll(".month-btn").forEach(btn => btn.classList.remove("active"));
    const activeBtn = document.getElementById(`month-btn-${selectedMonth}`);
    if (activeBtn) activeBtn.classList.add("active");
  }

  function getLeaderboardData() {
    const raw = localStorage.getItem("party_leaderboard_json");
    if (!raw) return [];
    try {
      return JSON.parse(raw);
    } catch (e) {
      return [];
    }
  }

  function addScoreToJSON(name, finalScore) {
    const scores = getLeaderboardData();
    scores.push({
      name: name,
      score: finalScore,
      timestamp: new Date().toISOString()
    });
    scores.sort((a, b) => b.score - a.score);
    localStorage.setItem("party_leaderboard_json", JSON.stringify(scores));
    return scores;
  }

  async function initApp() {
    const input = document.getElementById("player-name");
    if (!input.value.trim()) {
      alert("Please enter your name!");
      return;
    }
    playerName = input.value.trim();

    initMonthGrid();

    const startBtn = document.getElementById("btn-start");
    startBtn.disabled = true;
    startBtn.innerText = "Loading from Drive...";

    try {
      const [vidsRes, photosRes] = await Promise.all([
        fetch(`${API_URL}?action=getVideos`).then(r => r.json()),
        fetch(`${API_URL}?action=getPhotos`).then(r => r.json())
      ]);

      driveVideos = Array.isArray(vidsRes) ? vidsRes : [];
      drivePhotos = Array.isArray(photosRes) ? photosRes : [];

      if (driveVideos.length === 0) {
        alert("0 videos found. Ensure filenames contain 'milad', 'maher', or 'maisune'.");
        startBtn.disabled = false;
        startBtn.innerText = "Start Game";
        return;
      }

      document.getElementById("screen-login").classList.add("hidden");
      document.getElementById("screen-who").classList.remove("hidden");
      renderWho();
    } catch (err) {
      console.error(err);
      alert("Failed to reach Apps Script. Check network connection.");
      startBtn.disabled = false;
      startBtn.innerText = "Start Game";
    }
  }

  function renderWho() {
    if (!driveVideos || driveVideos.length === 0 || whoIdx >= driveVideos.length) return;

    document.getElementById("who-overlay").classList.add("hidden");

    const item = driveVideos[whoIdx];
    const frame = document.getElementById("who-frame");

    document.getElementById("who-count").innerText = `${whoIdx + 1}/${driveVideos.length}`;
    frame.src = `https://drive.google.com/file/d/${item.id}/preview`;
  }

  function submitWhoAnswer(choice) {
    if (!driveVideos[whoIdx]) return;

    const item = driveVideos[whoIdx];
    const isCorrect = choice.toLowerCase() === item.answer.toLowerCase();

    const iconEl = document.getElementById("who-icon");
    const titleEl = document.getElementById("who-title");
    const ptsEl = document.getElementById("who-pts");
    const detailEl = document.getElementById("who-detail");

    if (isCorrect) {
      score += 100;
      iconEl.innerText = "🎉";
      titleEl.className = "overlay-title correct";
      titleEl.innerText = "YOU GOT IT!";
      ptsEl.innerText = "+100 Points";
      detailEl.innerText = `It was indeed ${item.answer}!`;
    } else {
      iconEl.innerText = "😅";
      titleEl.className = "overlay-title wrong";
      titleEl.innerText = "NOT QUITE!";
      ptsEl.innerText = "+0 Points";
      detailEl.innerText = `That sound was actually ${item.answer}!`;
    }

    document.getElementById("who-overlay").classList.remove("hidden");
  }

  function advanceWho() {
    whoIdx++;
    if (whoIdx < driveVideos.length) {
      renderWho();
    } else {
      document.getElementById("screen-who").classList.add("hidden");
      document.getElementById("screen-age").classList.remove("hidden");
      renderAge();
    }
  }

  function renderAge() {
    if (!drivePhotos || drivePhotos.length === 0) {
      setTimeout(renderAge, 300);
      return;
    }

    document.getElementById("age-overlay").classList.add("hidden");

    const item = drivePhotos[ageIdx];
    document.getElementById("age-img").src = item.src;
    document.getElementById("age-count").innerText = `${ageIdx + 1}/${drivePhotos.length}`;

    // Reset selection state
    selectedMonth = null;
    document.getElementById("month-display-text").innerText = "Select a Month 👇";
    document.getElementById("btn-confirm-age").disabled = true;
    document.querySelectorAll(".month-btn").forEach(btn => btn.classList.remove("active"));
  }

  function submitAgeGuess() {
    if (!selectedMonth) return;

    const guess = selectedMonth;
    const actual = drivePhotos[ageIdx].actualMonths;
    const diff = Math.abs(guess - actual);
    const pts = Math.max(0, 100 - (diff * 25));
    score += pts;

    const iconEl = document.getElementById("age-icon");
    const titleEl = document.getElementById("age-title");
    const ptsEl = document.getElementById("age-pts");
    const detailEl = document.getElementById("age-detail");
    const nextBtn = document.getElementById("age-next-btn");

    if (diff === 0) {
      iconEl.innerText = "🎯";
      titleEl.className = "overlay-title correct";
      titleEl.innerText = "BULLSEYE!";
      ptsEl.innerText = "+100 Points";
      detailEl.innerText = `Exact match! Milad was ${actual} months old!`;
    } else if (diff === 1) {
      iconEl.innerText = "👏";
      titleEl.className = "overlay-title correct";
      titleEl.innerText = "SO CLOSE!";
      ptsEl.innerText = `+${pts} Points`;
      detailEl.innerText = `Milad was actually ${actual} months old!`;
    } else {
      iconEl.innerText = "📸";
      titleEl.className = "overlay-title wrong";
      titleEl.innerText = "NICE TRY!";
      ptsEl.innerText = `+${pts} Points`;
      detailEl.innerText = `Milad was actually ${actual} months old in this photo!`;
    }

    if (ageIdx + 1 >= drivePhotos.length) {
      nextBtn.innerText = "See Final Results 🏆";
    } else {
      nextBtn.innerText = "Next Photo ➔";
    }

    document.getElementById("age-overlay").classList.remove("hidden");
  }

  function advanceAge() {
    ageIdx++;
    if (ageIdx < drivePhotos.length) {
      renderAge();
    } else {
      document.getElementById("screen-age").classList.add("hidden");
      document.getElementById("screen-finish").classList.remove("hidden");
      document.getElementById("final-score").innerText = score;
    }
  }

  function saveScore() {
    const updatedLeaderboard = addScoreToJSON(playerName, score);
    renderLeaderboard(updatedLeaderboard);
  }

  function renderLeaderboard(scores) {
    document.getElementById("screen-finish").classList.add("hidden");
    document.getElementById("screen-leaderboard").classList.remove("hidden");

    const list = document.getElementById("leaderboard-items");
    if (!scores || scores.length === 0) {
      list.innerHTML = `<li style="text-align:center; padding:12px; color:var(--muted); font-size:0.9rem;">No scores yet. Be the first!</li>`;
      return;
    }

    list.innerHTML = scores.slice(0, 10).map((entry, idx) => `
      <li class="leaderboard-item">
        <span class="rank">#${idx + 1}</span>
        <span class="player">${escapeText(entry.name)}</span>
        <span class="pts">${entry.score} pts</span>
      </li>
    `).join("");
  }

  function escapeText(str) {
    const div = document.createElement("div");
    div.innerText = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
